[package]
name = "foundryvtt-streamdeck-plugin"
version = "0.5.0"
edition = "2024"
publish = false

[dependencies]
openaction = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
log = "0.4"
simplelog = "0.12"

[profile.release]
strip = true
