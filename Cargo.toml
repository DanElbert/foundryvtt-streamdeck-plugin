[package]
name = "foundryvtt-streamdeck-plugin"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
openaction = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
log = "0.4"
simplelog = "0.12"

[profile.release]
strip = true
