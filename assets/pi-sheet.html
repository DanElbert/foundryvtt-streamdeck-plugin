<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				padding: 12px;
				font: 13px/1.4 system-ui, sans-serif;
				color: #d8d8d8;
				background: #2d2d2d;
			}
			label {
				display: block;
				margin-bottom: 4px;
				color: #969696;
			}
			input,
			select {
				width: 100%;
				box-sizing: border-box;
				padding: 5px 6px;
				color: #d8d8d8;
				background: #3d3d3d;
				border: 1px solid #555;
				border-radius: 3px;
			}
			input[type="color"] {
				padding: 2px;
				height: 28px;
			}
			input[type="checkbox"] {
				width: auto;
				margin-right: 6px;
			}
			.field + .field {
				margin-top: 12px;
			}
			.row {
				display: flex;
				gap: 6px;
				align-items: center;
				margin-top: 6px;
			}
			button {
				padding: 4px 8px;
				color: #d8d8d8;
				background: #3d3d3d;
				border: 1px solid #555;
				border-radius: 3px;
				cursor: pointer;
			}
			button:hover {
				background: #4a4a4a;
			}
			#status {
				color: #969696;
				font-size: 12px;
			}
			.hint {
				margin: 4px 0 0;
				color: #969696;
				font-size: 12px;
			}
			details {
				margin-top: 16px;
				border-top: 1px solid #444;
				padding-top: 10px;
			}
			summary {
				cursor: pointer;
				color: #969696;
			}
			details > .field:first-of-type {
				margin-top: 10px;
			}
			.warn {
				margin: 6px 0 0;
				color: #e0a030;
				font-size: 12px;
			}
			.inline {
				display: flex;
				align-items: center;
			}
		</style>
	</head>

	<body>
		<div class="field">
			<label for="actor">Actor</label>
			<select id="actor">
				<option value="">(none)</option>
			</select>
			<div class="row">
				<button id="reload" type="button">Reload list</button>
				<button id="refresh" type="button">Refresh art</button>
				<span id="status"></span>
			</div>
		</div>

		<div class="field">
			<label for="uuid">Actor UUID (manual)</label>
			<input id="uuid" type="text" placeholder="Actor.xxxxxxxxxxxx" />
		</div>

		<div class="field">
			<label for="art">Artwork</label>
			<select id="art">
				<option value="token">Token</option>
				<option value="portrait">Portrait</option>
				<option value="preferred">System preferred</option>
			</select>
		</div>

		<div class="field inline">
			<input id="showTitle" type="checkbox" />
			<label for="showTitle" style="margin: 0">Show actor name</label>
		</div>

		<details>
			<summary>Relay connection (shared by all buttons)</summary>
			<div class="field">
				<label for="relayUrl">Relay URL</label>
				<input id="relayUrl" type="text" placeholder="wss://foundryrestapi.fly.dev" />
			</div>
			<div class="field">
				<label for="clientId">Client ID (optional)</label>
				<input id="clientId" type="text" placeholder="(taken from the API key)" />
				<p class="hint" id="resolved"></p>
			</div>
			<div class="field">
				<label for="apiKey">API key</label>
				<input id="apiKey" type="password" placeholder="(required)" />
			</div>
			<div class="field">
				<label for="pollMs">State poll interval (ms, 0 = off)</label>
				<input id="pollMs" type="number" step="500" min="0" />
				<p class="warn">
					Turn OFF "Notify on Execute JS" in the Foundry REST API module settings. While it
					is on, polling is disabled to avoid whispering the GM every interval.
				</p>
			</div>
			<div class="field">
				<label for="indicator">Open indicator</label>
				<select id="indicator">
					<option value="border">Coloured border</option>
					<option value="svg">Border via SVG overlay</option>
					<option value="title">Title marker</option>
				</select>
			</div>
			<div class="field">
				<label for="borderColor">Border colour</label>
				<input id="borderColor" type="color" />
			</div>
			<div class="row">
				<button id="saveConn" type="button">Save connection</button>
			</div>
		</details>

		<script>
			function connectOpenActionSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				const actionInfo = JSON.parse(inActionInfo);
				const context = actionInfo.context;
				const action = actionInfo.action;
				let settings = actionInfo.payload.settings ?? {};

				const el = (id) => document.getElementById(id);
				const idle = (node) => document.activeElement !== node;

				const toPlugin = (payload) =>
					websocket.send(JSON.stringify({ event: "sendToPlugin", context, action, payload }));

				const paint = () => {
					if (idle(el("actor"))) el("actor").value = settings.actorUuid ?? "";
					if (idle(el("uuid"))) el("uuid").value = settings.actorUuid ?? "";
					if (idle(el("art"))) el("art").value = settings.artSource ?? "token";
					if (idle(el("showTitle"))) el("showTitle").checked = settings.showTitle !== false;
				};

				const commit = () => {
					settings.artSource = el("art").value;
					settings.showTitle = el("showTitle").checked;
					websocket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
				};

				const pickActor = (uuid, name) => {
					settings.actorUuid = (uuid ?? "").trim();
					if (name !== undefined) settings.actorName = name ?? "";
					commit();
				};

				let pending;
				const debounce = (fn) => {
					clearTimeout(pending);
					pending = setTimeout(fn, 250);
				};

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
					toPlugin({ event: "getConnection" });
					toPlugin({ event: "getActors" });
				};

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);

					if (data.event === "didReceiveSettings") {
						settings = data.payload.settings ?? {};
						paint();
						return;
					}
					if (data.event !== "sendToPropertyInspector") return;
					const p = data.payload ?? {};

					if (p.event === "actors") {
						const sel = el("actor");
						sel.innerHTML = "";
						sel.appendChild(new Option("(none)", ""));
						const list = p.actors ?? [];
						if (p.status === "ok") {
							for (const a of list) sel.appendChild(new Option(a.name, a.uuid));
							el("status").textContent = list.length + " actors";
						} else {
							el("status").textContent = p.message || "unavailable";
						}
						if (settings.actorUuid && !list.some((a) => a.uuid === settings.actorUuid)) {
							const label = (settings.actorName || settings.actorUuid) + " (saved)";
							sel.appendChild(new Option(label, settings.actorUuid));
						}
						paint();
					}

					if (p.event === "connection") {
						if (idle(el("relayUrl"))) el("relayUrl").value = p.relayUrl ?? "";
						if (idle(el("clientId"))) el("clientId").value = p.clientId ?? "";
						if (idle(el("pollMs"))) el("pollMs").value = p.pollMs ?? 5000;
						if (idle(el("indicator"))) el("indicator").value = p.indicator ?? "border";
						if (idle(el("borderColor"))) el("borderColor").value = p.borderColor ?? "#ff6400";
						el("apiKey").placeholder = p.hasApiKey ? "(unchanged)" : "(required)";
						el("resolved").textContent = p.resolvedClientId
							? "relay resolved: " + p.resolvedClientId
							: "";
						let state = p.connected ? "relay connected" : "relay disconnected";
						if (p.pollDisabled) state += " — polling off (Notify on Execute JS is on)";
						el("status").textContent = state;
					}
				};

				el("actor").addEventListener("change", () =>
					pickActor(el("actor").value, el("actor").selectedOptions[0]?.textContent),
				);
				el("uuid").addEventListener("input", () => debounce(() => pickActor(el("uuid").value)));
				el("uuid").addEventListener("change", () => pickActor(el("uuid").value));
				el("art").addEventListener("change", commit);
				el("showTitle").addEventListener("change", commit);
				el("reload").addEventListener("click", () => toPlugin({ event: "getActors" }));
				el("refresh").addEventListener("click", () => toPlugin({ event: "refreshArt" }));
				el("saveConn").addEventListener("click", () =>
					toPlugin({
						event: "setConnection",
						relayUrl: el("relayUrl").value.trim(),
						clientId: el("clientId").value.trim(),
						apiKey: el("apiKey").value,
						pollMs: parseInt(el("pollMs").value, 10) || 0,
						indicator: el("indicator").value,
						borderColor: el("borderColor").value,
					}),
				);

				paint();
			}

			const connectElgatoStreamDeckSocket = connectOpenActionSocket;
		</script>
	</body>
</html>
