<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				padding: 12px;
				font: 13px/1.4 system-ui, sans-serif;
				color: #d8d8d8;
				background: #2d2d2d;
			}
			label {
				display: block;
				margin-bottom: 4px;
				color: #969696;
			}
			input,
			select {
				width: 100%;
				box-sizing: border-box;
				padding: 5px 6px;
				color: #d8d8d8;
				background: #3d3d3d;
				border: 1px solid #555;
				border-radius: 3px;
			}
			input[type="color"] {
				padding: 2px;
				height: 28px;
			}
			input[type="checkbox"] {
				width: auto;
				margin-right: 6px;
			}
			.field + .field {
				margin-top: 12px;
			}
			.row {
				display: flex;
				gap: 6px;
				align-items: center;
				margin-top: 6px;
			}
			button {
				padding: 4px 8px;
				color: #d8d8d8;
				background: #3d3d3d;
				border: 1px solid #555;
				border-radius: 3px;
				cursor: pointer;
			}
			button:hover {
				background: #4a4a4a;
			}
			#status {
				color: #969696;
				font-size: 12px;
			}
			.hint {
				margin: 4px 0 0;
				color: #969696;
				font-size: 12px;
			}
			details {
				margin-top: 16px;
				border-top: 1px solid #444;
				padding-top: 10px;
			}
			summary {
				cursor: pointer;
				color: #969696;
			}
			details > .field:first-of-type {
				margin-top: 10px;
			}
			.warn {
				margin: 6px 0 0;
				color: #e0a030;
				font-size: 12px;
			}
			.inline {
				display: flex;
				align-items: center;
			}
		</style>
	</head>

	<body>
		<div class="field">
			<label for="macro">Macro</label>
			<select id="macro">
				<option value="">(none)</option>
			</select>
			<div class="row">
				<button id="reload" type="button">Reload list</button>
				<button id="refresh" type="button">Refresh art</button>
				<span id="status"></span>
			</div>
			<p class="hint">
				Runs the macro in the GM's browser, with the tokens selected there as its
				<code>token</code>/<code>actor</code>.
			</p>
		</div>

		<div class="field">
			<label for="uuid">Macro UUID (manual)</label>
			<input id="uuid" type="text" placeholder="Macro.xxxxxxxxxxxx" />
		</div>

		<div class="field inline">
			<input id="showTitle" type="checkbox" />
			<label for="showTitle" style="margin: 0">Show macro name</label>
		</div>

		<details>
			<summary>Relay connection (shared by all buttons)</summary>
			<div class="field">
				<label for="relayUrl">Relay URL</label>
				<input id="relayUrl" type="text" placeholder="wss://foundryrestapi.fly.dev" />
			</div>
			<div class="field">
				<label for="clientId">Client ID (optional)</label>
				<input id="clientId" type="text" placeholder="(taken from the API key)" />
				<p class="hint" id="resolved"></p>
			</div>
			<div class="field">
				<label for="apiKey">API key</label>
				<input id="apiKey" type="password" placeholder="(required)" />
			</div>
			<p class="warn">
				Requires the Stream Deck Companion module (foundryvtt-streamdeck) enabled in the
				world and the patched relay. "Allow Execute JavaScript" can stay off.
			</p>
			<div class="row">
				<button id="saveConn" type="button">Save connection</button>
			</div>
		</details>

		<script>
			function connectOpenActionSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				const actionInfo = JSON.parse(inActionInfo);
				const context = actionInfo.context;
				const action = actionInfo.action;
				let settings = actionInfo.payload.settings ?? {};

				const el = (id) => document.getElementById(id);
				const idle = (node) => document.activeElement !== node;

				const toPlugin = (payload) =>
					websocket.send(JSON.stringify({ event: "sendToPlugin", context, action, payload }));

				const paint = () => {
					if (idle(el("macro"))) el("macro").value = settings.macroUuid ?? "";
					if (idle(el("uuid"))) el("uuid").value = settings.macroUuid ?? "";
					if (idle(el("showTitle"))) el("showTitle").checked = settings.showTitle !== false;
				};

				const commit = () => {
					settings.showTitle = el("showTitle").checked;
					websocket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
				};

				const pickMacro = (uuid, name) => {
					settings.macroUuid = (uuid ?? "").trim();
					if (name !== undefined) settings.macroName = name ?? "";
					commit();
				};

				const fillGrouped = (sel, list) => {
					const groups = new Map();
					for (const item of list) {
						const opt = new Option(item.name, item.uuid);
						if (!item.folder) {
							sel.appendChild(opt);
							continue;
						}
						let group = groups.get(item.folder);
						if (!group) {
							group = document.createElement("optgroup");
							group.label = item.folder;
							groups.set(item.folder, group);
							sel.appendChild(group);
						}
						group.appendChild(opt);
					}
				};

				let pending;
				const debounce = (fn) => {
					clearTimeout(pending);
					pending = setTimeout(fn, 250);
				};

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
					toPlugin({ event: "getConnection" });
					toPlugin({ event: "getMacros" });
				};

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);

					if (data.event === "didReceiveSettings") {
						settings = data.payload.settings ?? {};
						paint();
						return;
					}
					if (data.event !== "sendToPropertyInspector") return;
					const p = data.payload ?? {};

					if (p.event === "macros") {
						const sel = el("macro");
						sel.innerHTML = "";
						sel.appendChild(new Option("(none)", ""));
						const list = p.macros ?? [];
						if (p.status === "ok") {
							fillGrouped(sel, list);
							el("status").textContent = list.length + " macros";
						} else {
							el("status").textContent = p.message || "unavailable";
						}
						if (settings.macroUuid && !list.some((m) => m.uuid === settings.macroUuid)) {
							const label = (settings.macroName || settings.macroUuid) + " (saved)";
							sel.appendChild(new Option(label, settings.macroUuid));
						}
						paint();
					}

					if (p.event === "connection") {
						if (idle(el("relayUrl"))) el("relayUrl").value = p.relayUrl ?? "";
						if (idle(el("clientId"))) el("clientId").value = p.clientId ?? "";
						el("apiKey").placeholder = p.hasApiKey ? "(unchanged)" : "(required)";
						el("resolved").textContent = p.resolvedClientId
							? "relay resolved: " + p.resolvedClientId
							: "";
						let state = p.connected ? "relay connected" : "relay disconnected";
						if (p.connected) {
							state += p.companion ? " — companion " + p.companion : " — companion module missing";
						}
						el("status").textContent = state;
					}
				};

				el("macro").addEventListener("change", () =>
					pickMacro(el("macro").value, el("macro").selectedOptions[0]?.textContent),
				);
				el("uuid").addEventListener("input", () => debounce(() => pickMacro(el("uuid").value)));
				el("uuid").addEventListener("change", () => pickMacro(el("uuid").value));
				el("showTitle").addEventListener("change", commit);
				el("reload").addEventListener("click", () => toPlugin({ event: "getMacros" }));
				el("refresh").addEventListener("click", () => toPlugin({ event: "refreshArt" }));
				el("saveConn").addEventListener("click", () =>
					toPlugin({
						event: "setConnection",
						relayUrl: el("relayUrl").value.trim(),
						clientId: el("clientId").value.trim(),
						apiKey: el("apiKey").value,
					}),
				);

				paint();
			}

			const connectElgatoStreamDeckSocket = connectOpenActionSocket;
		</script>
	</body>
</html>
